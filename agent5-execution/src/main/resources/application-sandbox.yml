# ── Sandbox profile ────────────────────────────────────────────────────────────
# Activate with: -Dspring.profiles.active=sandbox
#
# Margin check  → api.upstox.com        (real production API, UPSTOX_ACCESS_TOKEN)
# Order placement → api-sandbox.upstox.com (sandbox, UPSTOX_SANDBOX_TOKEN)
#
# This gives real margin figures while placing zero-risk sandbox orders.
# ───────────────────────────────────────────────────────────────────────────────

upstox:
  api:
    # Market data and margin check remain on the real Upstox API
    base-url: https://api.upstox.com
    # Orders route to sandbox — not a secret, lives here
    order-base-url: https://api-sandbox.upstox.com
    # Order reads for sandbox orders live on the sandbox host (NOT production api.upstox.com,
    # which would have none of our sandbox orders).
    order-read-base-url: https://api-sandbox.upstox.com
    # Sandbox token for the order RestClient (UPSTOX_SANDBOX_TOKEN set as system env var)
    order-access-token: ${UPSTOX_SANDBOX_TOKEN:}

agent5:
  execution:
    fill-poll-interval-ms: 5000
    fill-timeout-ms: 30000
    slippage-alert-threshold: "0.10"
    product: D
    # Cancel on timeout in sandbox rather than converting to MARKET —
    # sandbox fills don't reflect real liquidity
    cancel-on-timeout-instead-of-market: true
    # Skip only the AVAILABLE-FUNDS sufficiency gate. The funds check
    # (GET /v2/user/get-funds-and-margin) runs against PRODUCTION api.upstox.com and reads your
    # REAL account balance — with zero capital it would reject every order before placement.
    # Keep TRUE until the account is funded. checkMargin still runs (read-only calculator).
    bypass-margin-check: true
    # Sandbox runs the REAL v3 order flow (place/modify/cancel on api-sandbox.upstox.com). It DOES
    # carry weekly NIFTY contracts and fills marketable orders, so no simulation is needed.
    # (Earlier belief that sandbox lacked weekly NIFTY was wrong — the failures were v2-vs-v3 +
    #  a distinct Sandbox-App token, both now resolved.)
    simulate-fills: false
    simulate-exit: false
    # Place ENTRY legs as MARKET so they fill immediately: the sandbox book does not match a resting
    # LIMIT, so a LIMIT entry sits open and is cancelled at timeout (never reaching ACTIVE).
    # Production keeps the default (false = LIMIT entry) for slippage control.
    market-order-entry: true

logging:
  level:
    com.the3Cgrp.zupptrade.agent5: DEBUG
    org.springframework.web.client: DEBUG
