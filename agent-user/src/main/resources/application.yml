spring:
  application:
    name: agent-user

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nifty_trading}
    username: ${DB_USERNAME:nifty_user}
    password: ${DB_PASSWORD:nifty_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: zupptrade_dev
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: zupptrade_dev
    init-sql: "SET search_path TO zupptrade_dev"

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8086

upstox:
  api:
    base-url: https://api.upstox.com
    # Login app (agent-user only) — the Upstox app whose redirect is the :8086 login callback.
    # KEEP THIS SEPARATE from UPSTOX_API_KEY, which is the market-data app (:8080) used by upstox-auth.
    api-key: ${UPSTOX_LOGIN_API_KEY:}
    api-secret: ${UPSTOX_LOGIN_API_SECRET:}
    access-token: ${UPSTOX_ACCESS_TOKEN:}
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}

# Multi-user auth (Phase 2). Secrets are env-only — never commit real values.
zupptrade:
  jwt:
    signing-key: ${JWT_SIGNING_KEY:}      # HS256 secret, >= 32 bytes
    access-ttl-minutes: 30
    refresh-ttl-days: 7
    issuer: zupptrade
  auth:
    ui-redirect-uri: ${AUTH_UI_REDIRECT:http://localhost:4200/auth/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8086/api/v1/agent-user/auth/google/callback}
    upstox:
      # Upstox client-id/secret come from upstox.api.api-key/api-secret; only the callback lives here.
      redirect-uri: ${UPSTOX_AUTH_REDIRECT:http://localhost:8086/api/v1/agent-user/auth/upstox/callback}

logging:
  level:
    com.the3Cgrp.zupptrade.agentUser: INFO
